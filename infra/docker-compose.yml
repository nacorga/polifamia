services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: polifamia
      POSTGRES_PASSWORD: polifamia
      POSTGRES_DB: polifamia
    ports: ['5432:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U polifamia']
      interval: 2s
      retries: 15
volumes:
  pgdata:
