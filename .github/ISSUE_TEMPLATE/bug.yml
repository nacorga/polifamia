name: Bug
description: Something does not work in the extension, the API or the tooling.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: Observed and expected behaviour.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: '1. … 2. … 3. …'
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version, browser and operating system
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: No keys, tokens or personal data.
      render: text
