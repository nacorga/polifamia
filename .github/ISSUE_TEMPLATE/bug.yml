name: Bug
description: Algo no funciona en la extensión, la API o las herramientas.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: Qué pasa
      description: Comportamiento observado y comportamiento esperado.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducirlo
      placeholder: '1. … 2. … 3. …'
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit o versión, navegador y sistema operativo
  - type: textarea
    id: logs
    attributes:
      label: Logs o capturas
      description: Sin claves, tokens ni datos personales.
      render: text
