name: Resultado incorrecto
description: Una investigación cita mal una fuente, la interpreta mal o llega a una conclusión que la evidencia no sostiene.
labels: [resultado]
body:
  - type: markdown
    attributes:
      value: |
        Revisamos la evidencia, no la opinión sobre el orador. Lee los criterios en [docs/governance.md](https://github.com/nacorga/polifamia/blob/main/docs/governance.md).
  - type: textarea
    id: claim
    attributes:
      label: Afirmación investigada
      description: Texto literal, vídeo y minuto (o «texto pegado»).
    validations:
      required: true
  - type: input
    id: result
    attributes:
      label: Resultado mostrado y fecha de «comprobado el…»
      placeholder: NEEDS_CONTEXT · 2026-10-21
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Tipo de problema
      options:
        - La fuente citada no dice lo que se le atribuye
        - Fuente desactualizada o enlace roto
        - Cálculo o periodo incorrecto
        - Falta una fuente primaria relevante
        - Conclusión no sostenida por la evidencia
        - Otro
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidencia
      description: Enlace a la fuente primaria (serie, artículo, página) que lo demuestra.
    validations:
      required: true
